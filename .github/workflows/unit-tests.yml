name: unit-tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JWT_VERIFICATION_TOKEN_SECRET: test-verification-secret

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: run unit tests
        run: npm run test:unit
