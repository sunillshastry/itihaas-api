x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: itihaas-api
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379
    REDIS_CACHE_URL: redis://redis-cache:6379
    SMTP_HOST: mailpit
  volumes:
    - .:/app
    - /app/node_modules
  depends_on:
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy

services:
  server:
    <<: *app
    ports:
      - '8000:8000'
    command: ['npm', 'run', 'dev']

  worker:
    <<: *app
    command: ['npm', 'run', 'worker']

  # Existing Redis: BullMQ email jobs
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # New Redis: API caching only
  redis-cache:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

volumes:
  redis-data:
